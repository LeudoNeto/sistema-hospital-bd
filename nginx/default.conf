server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Rotas da API → backend (FastAPI). O front usa caminhos relativos
    # (ex.: fetch("/atendimentos")), então o nginx repassa esses prefixos.
    location ~ ^/(atendimentos|auditoria|internacoes|pacientes|procedimentos|profissionais|relatorios|escalas|unidades|docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Front-end estático (HTML/CSS/JS).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
