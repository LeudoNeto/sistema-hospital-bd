services:
  backend:
    build: ./backend
    container_name: hospital_backend
    restart: on-failure
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    depends_on:
      - db

  frontend:
    image: nginx:1.27-alpine
    container_name: hospital_frontend
    restart: on-failure
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: hospital_mysql
    restart: on-failure
    ports:
      - "3306:3306"
    env_file: ./backend/.env
    volumes:
      - hospital_mysql_data:/var/lib/mysql

volumes:
  hospital_mysql_data: